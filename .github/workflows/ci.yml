# The checks every push must pass — in the Trix repository and in every
# project made from it (`npm create trix-astro` copies this file). Steps for
# the framework's own docs site and installer run only where those exist.
#
# Every push and pull request runs the fast checks: install, types,
# conventions, the unit tests, the build and the SEO audit — about 2 minutes.
# The browsers, the slow part, run every Monday and by hand (Actions → CI →
# Run workflow), so a push never waits on them. Repository variables
# (Settings → Secrets and variables → Actions → Variables) tune them:
#   TRIX_BROWSERS     chrome,firefox,webkit (default) — or fewer, e.g. chrome
#   TRIX_PAGE_SAMPLE  pages tested per section, default 5 (/blog/* → 5 posts);
#                     every top-level page is always tested; all = every page
#   TRIX_SAFARI       on — also test real Safari (macOS, 10× the Linux rate)
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Monday morning: every page in every browser, new security advisories, and
  # whether the newest Astro still builds the site.
  schedule:
    - cron: "0 6 * * 1"

# A newer commit makes an in-flight run redundant, so drop it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # The check main requires before a merge: keep the name.
    name: Check, build and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # The oldest supported release, so newer syntax can't slip in unnoticed.
      # Read from package.json, so the floor is written in one place.
      - name: Read the oldest supported Node
        id: node
        run: echo "version=$(jq -er '.engines.node | ltrimstr(">=")' package.json)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ steps.node.outputs.version }}
          cache: npm

      - run: npm ci --engine-strict

      # An advisory arrives on its own schedule, not with a push: a push only
      # warns, and the Monday run fails until the dependency is updated.
      - run: npm audit --audit-level=high
        continue-on-error: ${{ github.event_name != 'schedule' }}

      - run: npm run format:check

      - run: npm run check

      - run: npm run test:cms

      - run: npm run test:tokens

      - run: npm run test:import-figma

      - name: The installer (framework only)
        if: hashFiles('packages/create-trix-astro/package.json') != ''
        run: npm run test:create

      # Every scripted component in a scratch site: Tabs labelled in any
      # language, form fields, pages swapped by ClientRouter, and every page
      # under the Content Security Policy that CSP in src/consts.ts turns on.
      - name: The components' scripts (framework only)
        if: hashFiles('tests/components.ts') != ''
        run: npm run test:components

      - run: npm run build

      # What search engines read, page by page, in Chrome: titles, canonicals,
      # one h1, alt text, structured data, broken links, sitemap — every page.
      # A project's also fails while SITE_URL in src/consts.ts is still the
      # placeholder, which would point every canonical, the sitemap and the
      # social images at example.com. The framework keeps the placeholder.
      - name: SEO
        run: npm run seo -- ${{ hashFiles('packages/create-trix-astro/package.json') == '' && '--production' || '' }}

      # The docs site renders every component as it is now, so a component
      # change that breaks its page fails here.
      - name: The docs site (framework only)
        if: hashFiles('site/astro.config.mjs') != ''
        run: |
          (cd site && npx astro check)
          npm run docs:build
          node scripts/seo/audit.ts --dir site/dist

  browsers:
    name: Browsers
    # Mondays and by hand: one job installs and builds once, then tests the
    # three engines every browser is built on — Chromium, Firefox and WebKit.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # A browser that hangs fails here, instead of spending minutes for hours.
    timeout-minutes: 25
    env:
      BROWSERS: ${{ vars.TRIX_BROWSERS || 'chrome,firefox,webkit' }}
    steps:
      - uses: actions/checkout@v7

      - name: Read the oldest supported Node
        id: node
        run: echo "version=$(jq -er '.engines.node | ltrimstr(">=")' package.json)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ steps.node.outputs.version }}
          cache: npm

      - run: npm ci

      - run: npm run build

      # The consent skill's templates: the Worker bundles, and a scratch site
      # built from them passes the skill's own browser check.
      - name: The consent templates (framework only)
        if: hashFiles('tests/consent.ts') != ''
        run: npm run test:consent

      # Chrome comes with the Ubuntu image; Firefox and WebKit are installed.
      - name: Install Firefox and WebKit
        run: |
          engines=$(echo "$BROWSERS" | tr ',' '\n' | grep -E '^(firefox|webkit)$' | tr '\n' ' ')
          [ -z "$engines" ] || npx playwright-core install --with-deps $engines

      - name: Every page in every engine
        run: node tests/browsers.ts --browser "$BROWSERS" --sample "${{ vars.TRIX_PAGE_SAMPLE || '5' }}"

      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: browsers
          path: .trix/browsers.md

  safari:
    name: Browser (safari)
    # The real Safari runs only on macOS, which GitHub bills at ten times the
    # Linux rate in a private repository, and whose runners can be scarce. So
    # it runs with the other browsers — Mondays and by hand — in a public
    # repository; a private project relies on WebKit, Safari's engine, unless
    # its repository variable TRIX_SAFARI is "on".
    if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && (!github.event.repository.private || vars.TRIX_SAFARI == 'on')
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Read the oldest supported Node
        id: node
        run: echo "version=$(jq -er '.engines.node | ltrimstr(">=")' package.json)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ steps.node.outputs.version }}
          cache: npm

      - run: npm ci

      - run: npm run build

      - run: sudo safaridriver --enable

      - run: node tests/browsers.ts --browser safari --sample "${{ vars.TRIX_PAGE_SAMPLE || '5' }}"

      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: browsers-safari
          path: .trix/browsers.md

  astro-latest:
    name: Astro latest (advisory)
    # Weekly (or by hand from the Actions tab), not on every push: it reports
    # that Astro moved, which changes on Astro's schedule, not the site's.
    # A signal, not a gate — red here never blocks a merge.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The integrations move with Astro. `@astrojs/sitemap` declares no peer
      # dependency on astro, so a mismatched pair installs quietly and nothing
      # else in this repository would notice.
      - run: npm install astro@latest @astrojs/sitemap@latest

      - run: npm run check

      - run: npm run build
