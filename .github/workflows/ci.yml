# The checks every push must pass — in the Trix repository and in every
# project made from it (`npm create trix-astro` copies this file). Steps for
# the framework's own docs site and installer run only where those exist.
#
# Built for a private repository, where GitHub bills every job by the minute,
# rounded up: one job installs and builds once, then tests the three browser
# engines — Chromium, Firefox and WebKit — that every browser is built on.
# About 5 minutes a push for a small site. Repository variables (Settings →
# Secrets and variables → Actions → Variables) tune it:
#   TRIX_BROWSERS     chrome,firefox,webkit (default) — or fewer, e.g. chrome
#   TRIX_PAGE_SAMPLE  pages tested per section, default 5 (/blog/* → 5 posts);
#                     every top-level page is always tested; all = every page
#   TRIX_SAFARI       on — also test real Safari (macOS, 10× the Linux rate)
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Monday morning: new security advisories, and whether the newest Astro
  # still builds the site. The code is the one already tested, so the
  # browsers are not run again.
  schedule:
    - cron: "0 6 * * 1"

# A newer commit makes an in-flight run redundant, so drop it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Check, build and test
    runs-on: ubuntu-latest
    # A browser that hangs fails here, instead of spending minutes for hours.
    timeout-minutes: 25
    env:
      BROWSERS: ${{ vars.TRIX_BROWSERS || 'chrome,firefox,webkit' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # The oldest supported release, so newer syntax can't slip in unnoticed.
          node-version: 22.19.0
          cache: npm

      - run: npm ci --engine-strict

      - run: npm audit --audit-level=high

      - run: npm run format:check

      - run: npm run check

      - run: npm run test:cms

      - run: npm run test:tokens

      - run: npm run test:import-figma

      - name: The installer (framework only)
        if: hashFiles('packages/create-trix-astro/package.json') != ''
        run: npm run test:create

      # The consent skill's templates: the Worker bundles, and a scratch site
      # built from them passes the skill's own browser check.
      - name: The consent templates (framework only)
        if: hashFiles('tests/consent.ts') != ''
        run: npm run test:consent

      - run: npm run build

      # What search engines read, page by page, in Chrome: titles, canonicals,
      # one h1, alt text, structured data, broken links, sitemap — every page.
      - run: npm run seo

      # The docs site renders every component as it is now, so a component
      # change that breaks its page fails here.
      - name: The docs site (framework only)
        if: hashFiles('site/astro.config.mjs') != ''
        run: |
          (cd site && npx astro check)
          npm run docs:build
          node scripts/seo/audit.ts --dir site/dist

      # Chrome comes with the Ubuntu image; Firefox and WebKit are installed.
      - name: Install Firefox and WebKit
        if: github.event_name != 'schedule'
        run: |
          engines=$(echo "$BROWSERS" | tr ',' '\n' | grep -E '^(firefox|webkit)$' | tr '\n' ' ')
          [ -z "$engines" ] || npx playwright-core install --with-deps $engines

      - name: Every page in every engine
        if: github.event_name != 'schedule'
        run: node tests/browsers.ts --browser "$BROWSERS" --sample "${{ vars.TRIX_PAGE_SAMPLE || '5' }}"

      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: browsers
          path: .trix/browsers.md

  safari:
    name: Browser (safari)
    # The real Safari runs only on macOS, which GitHub bills at ten times the
    # Linux rate in a private repository. So it runs on every push of a public
    # one; a private project relies on WebKit — Safari's engine, tested above —
    # unless its repository variable TRIX_SAFARI is "on". Only once the checks
    # pass, and never on the weekly run.
    needs: test
    if: github.event_name != 'schedule' && (!github.event.repository.private || vars.TRIX_SAFARI == 'on')
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22.19.0
          cache: npm

      - run: npm ci

      - run: npm run build

      - run: sudo safaridriver --enable

      - run: node tests/browsers.ts --browser safari --sample "${{ vars.TRIX_PAGE_SAMPLE || '5' }}"

      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: browsers-safari
          path: .trix/browsers.md

  astro-latest:
    name: Astro latest (advisory)
    # Weekly (or by hand from the Actions tab), not on every push: it reports
    # that Astro moved, which changes on Astro's schedule, not the site's.
    # A signal, not a gate — red here never blocks a merge.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The integrations move with Astro. `@astrojs/sitemap` declares no peer
      # dependency on astro, so a mismatched pair installs quietly and nothing
      # else in this repository would notice.
      - run: npm install astro@latest @astrojs/sitemap@latest

      - run: npm run check

      - run: npm run build
