# The checks every push must pass — in the Trix repository and in every
# project made from it (`npm create trix-astro` copies this file). Steps for
# the framework's own docs site and installer run only where those exist.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Monday morning, so an Astro release is found within a week of landing
  # rather than whenever someone next happens to upgrade.
  schedule:
    - cron: "0 6 * * 1"

# A newer commit makes an in-flight run redundant, so drop it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Type-check and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # The oldest supported release, so newer syntax can't slip in unnoticed.
          node-version: 22.19.0
          cache: npm

      - run: npm ci --engine-strict

      - run: npm audit --audit-level=high

      - run: npm run format:check

      - run: npm run check

      - run: npm run test:cms

      - run: npm run test:tokens

      - run: npm run test:import-figma

      - name: The installer (framework only)
        if: hashFiles('packages/create-trix-astro/package.json') != ''
        run: npm run test:create

      - run: npm run build

      # What search engines read, page by page, in Chrome: titles, canonicals,
      # one h1, alt text, structured data, broken links, sitemap.
      - run: npm run seo

      # The docs site renders every component as it is now, so a component
      # change that breaks its page fails here.
      - name: The docs site (framework only)
        if: hashFiles('site/astro.config.mjs') != ''
        run: |
          (cd site && npx astro check)
          npm run docs:build
          node scripts/seo/audit.ts --dir site/dist

  browsers:
    name: Browser (${{ matrix.browser }})
    runs-on: ${{ matrix.os }}
    # A browser that hangs fails here, instead of holding a runner for hours.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { browser: chrome, os: ubuntu-latest }
          - { browser: edge, os: ubuntu-latest }
          - { browser: brave, os: ubuntu-latest }
          - { browser: firefox, os: ubuntu-latest }
          - { browser: webkit, os: ubuntu-latest }
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22.19.0
          cache: npm

      - run: npm ci

      - run: npm run build

      # Chrome and Edge come with the Ubuntu image; the rest are installed.
      - name: Install Firefox or WebKit
        if: matrix.browser == 'firefox' || matrix.browser == 'webkit'
        run: npx playwright-core install --with-deps ${{ matrix.browser }}

      - name: Install Edge if missing
        if: matrix.browser == 'edge'
        run: command -v microsoft-edge || npx playwright-core install --with-deps msedge

      - name: Install Brave
        if: matrix.browser == 'brave'
        run: |
          sudo curl -fsSLo /usr/share/keyrings/brave-browser-archive-keyring.gpg https://brave-browser-apt-release.s3.brave.com/brave-browser-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/brave-browser-archive-keyring.gpg] https://brave-browser-apt-release.s3.brave.com/ stable main" | sudo tee /etc/apt/sources.list.d/brave-browser-release.list
          sudo apt-get update && sudo apt-get install -y brave-browser

      - run: node tests/browsers.ts --browser ${{ matrix.browser }}

      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: browsers-${{ matrix.browser }}
          path: .trix/browsers.md

  safari:
    name: Browser (safari)
    # The real Safari runs only on macOS, which GitHub bills at ten times the
    # Linux rate in a private repository. So it runs on every push of a public
    # one; a private project relies on WebKit — Safari's engine, tested above —
    # unless its repository variable TRIX_SAFARI is "on". Never on the weekly
    # run, which is there for Astro releases.
    if: github.event_name != 'schedule' && (!github.event.repository.private || vars.TRIX_SAFARI == 'on')
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22.19.0
          cache: npm

      - run: npm ci

      - run: npm run build

      - run: sudo safaridriver --enable

      - run: node tests/browsers.ts --browser safari

      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: browsers-safari
          path: .trix/browsers.md

  astro-latest:
    name: Astro latest (advisory)
    runs-on: ubuntu-latest
    # A signal, not a gate. Red here means Astro moved, not that this branch is
    # broken, so it never blocks a merge — it just says the pairing needs a look.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The integrations move with Astro. `@astrojs/sitemap` declares no peer
      # dependency on astro, so a mismatched pair installs quietly and nothing
      # else in this repository would notice.
      - run: npm install astro@latest @astrojs/sitemap@latest

      - run: npm run check

      - run: npm run build
